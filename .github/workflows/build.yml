name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ADTOF-windows-x64
          - os: ubuntu-latest
            artifact: ADTOF-linux-x64
          - os: macos-latest
            artifact: ADTOF-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev libsndfile1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r dev-requirements.txt

      - name: Build executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --name ADTOF
          --windowed
          --onedir
          --collect-all adtof_pytorch
          --collect-all librosa
          --collect-all torch
          --collect-all numba
          --copy-metadata adtof_pytorch
          --copy-metadata librosa
          --copy-metadata torch
          --hidden-import adtof_pytorch
          --hidden-import adtof_pytorch.model
          --hidden-import adtof_pytorch.audio
          --hidden-import adtof_pytorch.post_processing
          --hidden-import pretty_midi
          main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
